<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>
    <filter id="bareShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Modern Monochrome Minimalist Canvas -->
  <rect width="160" height="160" rx="36" fill="#121215" />
  <rect x="2" y="2" width="156" height="156" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <!-- The "Bare Minimum" Golden Ratio Monolith Cube / Essential Block -->
  <g filter="url(#bareShadow)">
    <!-- Isometric Minimalist Cube -->
    <!-- Top Face -->
    <polygon points="80,36 116,56 80,76 44,56" fill="#27272a" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Left Face -->
    <polygon points="44,56 80,76 80,120 44,100" fill="#18181b" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Right Face -->
    <polygon points="80,76 116,56 116,100 80,120" fill="#09090b" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Pure Core Sparkle Node (The Essential Catalyst) -->
    <circle cx="80" cy="76" r="4.5" fill="#ffffff" />
    <line x1="80" y1="24" x2="80" y2="30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="80" cy="18" r="2.5" fill="#ffffff" />
  </g>
</svg>
