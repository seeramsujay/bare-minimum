[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "essentials"
version = "1.0.0"
description = "The Universal, All-in-One AI Developer Toolkit & Portable Skills Library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["skills", "templates", "resources"]
